# Output contract (PRD §6, §8.1).
#
# Packs control citation *display* only, never storage. Dedupe, coverage and the review
# panel are engine-level and cross-regime; one pack citing differently breaks all three.

columns:
  - id: date
    header: Date
  - id: locator
    header: Document          # SAAQ uses DOSSIER; that difference lives in that pack
  - id: content
    header: Contenu

locator:
  # The gold uses both a line break and `Médical / Clinique médicale Mère et Monde p. 5`.
  separator: " / "
  line_break_before_page: true
  page_prefix: "p. "
  # Whether the doc-type code renders. Stored regardless — we classify every unit anyway,
  # so carrying both resolves for free (§8.1). Behaviour flag: `render.doctype_code`.
  show_doctype_code: false

rows:
  # Undated rows lead the document, so they are the first thing reviewed rather than the
  # last thing discovered (§8.5).
  undated_heading: "SANS DATE — {n} documents à dater"
  illegible_label: "Illisible"
  second_hand_marker: "(cité dans {locator})"
  ambiguous_date_marker: " (?)"

title_line:
  # Code renders the row. The model never writes one (§3.2).
  template: "{class_label}{author_suffix}"
  author_suffix: " — {author}"
