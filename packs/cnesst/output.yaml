# Output contract (PRD §6, §8.1).
#
# Packs control citation *display* only, never storage. Dedupe, coverage and the review
# panel are engine-level and cross-regime; one pack citing differently breaks all three.

columns:
  - id: date
    header: Date
  - id: locator
    header: Document          # SAAQ uses DOSSIER; that difference lives in that pack
  - id: content
    header: Contenu

locator:
  # The gold uses both a line break and `Médical / Clinique médicale Mère et Monde p. 5`.
  separator: " / "
  line_break_before_page: true
  page_prefix: "p. "
  # Whether the doc-type code renders. Stored regardless — we classify every unit anyway,
  # so carrying both resolves for free (§8.1). Behaviour flag: `render.doctype_code`.
  show_doctype_code: false

rows:
  # Undated rows lead the document, so they are the first thing reviewed rather than the
  # last thing discovered (§8.5).
  undated_heading: "SANS DATE — {n} documents à dater"
  illegible_label: "Illisible"
  second_hand_marker: "(cité dans {locator})"
  ambiguous_date_marker: " (?)"

title_line:
  # Code renders the row. The model never writes one (§3.2).
  template: "{class_label}{author_suffix}"
  author_suffix: " — {author}"

# How a deterministically-read field (4a) reads as a line in the row. Keyed by the field's
# base name, so `bareme.1` and `bareme.2` share one template.
#
# Without these the row shows the storage form — `bareme.1: code=204 219|pct=2` — which is
# a machine artefact appearing in a document destined for opposing counsel.
# Which source lines become row content.
#
# From PART 0 of the framework: she does **not** summarise, she **transcribes selected
# lines**. Transcribing every line is not that — it is the document again, with citations.
# A note carries ~100 lines and perhaps eight of them belong in a chronology.
#
# Selection is the pack's business, not the engine's: which sections of a clinical note
# matter is regime and specialty knowledge.
row_content:
  # Content under these section headings goes into the row.
  include_sections:
    - "raison\\s*de\\s*la\\s*(?:visite|consultation)"
    - "histoire\\s*de\\s*la\\s*maladie"
    - "motif\\s*de\\s*(?:la\\s*)?consultation"
    - "subjectif"
    - "objectif"
    - "examen"
    - "impression"
    - "conclusion"
    - "diagnostic"
    - "\\bplan\\b"
    - "prescription"
    - "recommandations?"
    - "[ée]volution"
    - "observations?"
    - "interventions?"
    - "bilan\\s*des\\s*s[ée]quelles"
    - "limitations?\\s*fonctionnelles?"
    - "atteinte\\s*permanente"
    - "consolidation"
    - "renseignements\\s*cliniques"
    - "technique"

  # Never row content, whatever section they sit under.
  exclude_sections:
    - "confidentiel"
    - "avis\\s*de\\s*confidentialit[ée]"
    - "ant[ée]c[ée]dents\\s*familiaux"

  # Identity and letterhead. These repeat on every sheet and say nothing about the
  # encounter. Blocks stay in the manifest and every citation still resolves to them —
  # the row is a projection, not a replacement (§3.1, §3.4).
  suppress:
    - "^\\s*nom\\s*du\\s*patient"
    # Health-insurance number and date of birth, however the provider lays them out.
    # A one-page report has no repetition to learn from, so its letterhead has to be
    # named: `Quebec NAM: HUAE70071617`, `PREVOST Naissance: 1970-07-16`.
    - "\\bnam\\s*:?\\s*[A-Za-z]{4}\\d"
    - "\\bnaissance\\s*:?\\s*\\d{4}-"
    - "date\\s*de\\s*naissance"
    - "^\\s*\\d{3}\\s*rue\\b"
    - ",\\s*(QC|Qu[ée]bec)\\s+[A-Z]\\d[A-Z]"      # a postal address line
    - "date\\s*d.?\\s*expiration"
    - "sexe\\s*[àa]\\s*la\\s*naissance"
    - "^\\s*t[ée]l\\.?\\s*:"
    - "^\\s*fax\\s*:"
    - "^\\s*\\d+\\s*(boul|boulevard|rue|av|avenue|chemin|ch\\.)\\b"
    - "^\\s*dossier\\s*:"
    - "^\\s*n[°o]\\s*de\\s*dossier"
    - "t[ée]l[ée]phone\\s*\\+?\\d"
    - "^\\s*note\\s*[-–—]\\s*"          # the note-type line is already the row title

  #: A line repeating on this many pages of one unit is page furniture, not content.
  #: Chronology content does not appear identically on every sheet.
  repeat_is_furniture: 2

field_lines:
  # The pack's own vocabulary: APIPP under CNESST, IPNP under SAAQ (§6). The field id is
  # `apipp` to match the first-class declaration; the rendered wording stays the long form
  # the paralegal reads.
  apipp: "Atteinte permanente : {value}"
  consolidation: "Consolidation : {value}"
  limitations_fonctionnelles: "Limitations fonctionnelles : {value}"
  diagnostic: "Diagnostic : {value}"
  bareme: "Barème {code} — {pct} %"
  bareme_with_prior: "Barème {code} — {pct} % ({prior_pct} % sur antérieur)"

  # §8.6 fields read by cue. `trajectory` renders her sentence verbatim with no prefix —
  # the wording is the evidence, and a label in front of it would be the engine speaking.
  trajectory: "{value}"
  confounder: "Facteur confondant : {value}"
  intercurrent_event: "Événement intercurrent : {value}"
  claimed_but_unrated: "Séquelle alléguée non retenue au barème : {value}"
  procured_by: "Rapport obtenu : {value}"

# Stored for querying, never printed. The trajectory enum sits beside the sentence it was
# derived from; rendering both prints the finding twice, once in her words and once in the
# engine's (§8.6).
index_fields:
  - trajectory.enum
  - evidence_weight

# How a first-class state is worded in the deliverable. An internal state id must never
# reach a document the firm hands to opposing counsel — the same rule as `unknown_label`.
#
# The four states stay four in the output. `aucune` ≠ `trop tôt` ≠ absent, and collapsing
# any pair here would undo the whole point of storing them separately (§8.6).
state_labels:
  apipp:
    rated: "oui"
    aucune: "aucune"
    trop_tot: "trop tôt pour se prononcer"
    absent: "non renseignée au rapport"
  limitations_fonctionnelles:
    rated: "oui"
    aucune: "aucune"
    trop_tot: "trop tôt pour se prononcer"
    absent: "non renseignées au rapport"
  consolidation:
    oui: "oui"
    non: "non"
    trop_tot: "trop tôt pour se prononcer"
    absent: "non renseignée au rapport"
  procured_by:
    treating: "par le médecin traitant"
    insurer_expert: "à la demande de la partie adverse"
  trajectory.enum:
    amelioration: "amélioration"
    deterioration: "détérioration"
    stable: "stationnaire"
    unclassified: "évolution décrite, non classée"
